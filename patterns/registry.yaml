# patterns/registry.yaml — Machine-readable loop pattern index

patterns:
  - id: architecture-unification
    name: Architecture Unification
    level: L2
    scope: agents, orchestration, dispatch
    cadence: per-session
    stateFile: STATE.md
    verifier: skills/loop-verifier
    budget: loop-budget.md
    constraints: loop-constraints.md
    gates:
      - build: npm run build
      - tests: npm test
      - reviewer: loop-verifier
  - id: security-hardening
    name: Security & Fail-Closed Hardening
    level: L2
    scope: adapters, embeds, secrets, execution
    cadence: per-session
    stateFile: STATE.md
    verifier: skills/loop-verifier
    budget: loop-budget.md
    constraints: loop-constraints.md
    gates:
      - build: npm run build
      - tests: npm test
      - reviewer: loop-verifier
  - id: deep-audit
    name: Deep Area Audit
    level: L1
    scope: read-only exploration per area
    cadence: per-session
    stateFile: STATE.md
    verifier: skills/loop-verifier
    budget: loop-budget.md
    constraints: loop-constraints.md
    gates:
      - report: STATE.md Audit Log
